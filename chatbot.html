<!DOCTYPE html>
<html>
  <head>
    <title>Chat Bot</title>
  </head>
  <body>
    <div class="body"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      const container = document.querySelector('.body');

      function ChatInput() {

        const[inputText,setInputText] = React.useState('');
        
      function saveInputText(event) {
        setInputText(event.target.value);
      }

      function sendMsg() {
         setChatMsgs([
            ...chatMsgs,
            {
              msg: 'test',
              sender: 'user',
              id: crypto.randomUUID()
              
            }
          ]);
      }

        return(
            <>
                <input placeholder="enter something" size="30"
                onChange={saveInputText}
                ></input>
                <button
                onClick={sendMsg}
                >submit</button>
            </>
        );
      }

      function ChatMsg({msg, sender}) {
        // const msg = props.msg;
        // const sender = props.sender;
        // const {msg, sender} = props;
        // if(sender === 'user') {
        //       return(
        //         <div>
        //             {msg}
        //             <img src="user.png" width="50"/>
        //         </div>
        // );
        // } else {
        //     return(
        //         <div>
        //             <img src="robot.png" width="50"/>
        //             {msg}
        //         </div>
        //     );
        // }

        return(
            <div>
            {sender === 'user' && <img src="user.png" width="50"/>}
            {msg}
            {sender === 'robot' && <img src="robot.png" width="50"/>}
            </div>
        );
      }

      function ChatMsgs() {
        return(
            <>
                  
                {
                  chatMsgs.map((chatMsg)=> {
                  return(
                    <ChatMsg 
                    msg={chatMsg.msg}
                    sender = {chatMsg.sender}
                    key = {chatMsg.id}
                    />);
                })}
            
            </>

        );

         
      }

      function App() {
          const [chatMsgs,setChatMsgs] = React.useState(
          [{
            msg: 'hello chatbot',
            sender: 'user',
            id: 'id1'
          },{
            msg: 'Hello! How can I help you',
            sender: 'robot',
            id: 'id2'
          },{
            msg: 'can you get me todays date',
            sender: 'user',    
            id:'id3'
          },{
            msg: 'Todays date is 30',
            sender: 'robot',
            id:'id5'
          } 
        ]);
        
        return(
          <>
          <ChatInput
          chatMsgs={chatMsgs}
          setChatMsgs={setChatMsgs}
          />
          <ChatMsgs/>
          </>
        );
        
      }

      ReactDOM.createRoot(container).render(<App />)
      
    </script>
  </body>
</html>
